[package]
name = "slopos-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "slopos-kernel"
path = "src/main.rs"

[features]
journal-replay-injection = []

[dependencies]
slopos-acpi = { path = "../crates/acpi" }
slopos-boot-protocol = { path = "../crates/boot-protocol" }
slopos-ebpf = { path = "../ebpf" }
slopos-elf = { path = "../crates/elf" }
slopos-ext4 = { path = "../crates/ext4" }
slopos-pci = { path = "../crates/pci" }
slopos-process = { path = "../crates/process" }
slopos-shell = { path = "../crates/shell" }
slopos-vfs = { path = "../crates/vfs" }
slopos-virtio = { path = "../crates/virtio" }
